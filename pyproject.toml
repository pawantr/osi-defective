[project]
name = "defective"
version = "0.1.0"
description = "DEFECTIVE: agentic, source-linked assignment of deep-level traps to candidate defects (OSI Hackathon 2026)"
readme = "README.md"
authors = [
    { name = "Pawan Tripathi", email = "ptripathi@anl.gov" }
]
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.1.0",
    "google-genai>=2.32.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.36.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
ui = [
    "gradio>=6.30.0",
]
mcp = [
    "mcp>=2.3.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
defective = "defective.cli:main"
